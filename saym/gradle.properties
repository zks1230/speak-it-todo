org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dhttp.socketTimeout=120000 -Dhttp.connectionTimeout=60000
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.suppressUnsupportedCompileSdk=34
kotlin.code.style=official

# 原项目里的 127.0.0.1:18080 代理在开发机上已无进程监听，留着会让 Gradle 每个仓库空等超时
# (实测一次构建卡 7 分钟)。你的环境若确实需要代理，取消注释并改成自己的端口。
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=18080
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=18080
# systemProp.http.nonProxyHosts=localhost|127.0.0.1

